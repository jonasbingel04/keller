name: keller
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  line_awesome_flutter: ^3.0.1
  community_material_icon: ^5.9.55
  supabase_flutter: ^2.12.0
  intl: ^0.20.2
  flutter_native_splash: ^2.4.7
  flutter_dotenv: ^6.0.0
  mobile_scanner: ^7.4.2
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon_transparent.png"
  monochrome_android_icon: "assets/images/app_icon_transparent.png"


flutter_native_splash:
  color: "#FF37474F"
  image: assets/images/app_icon_transparent.png
  android_12:
    image: assets/images/app_icon_transparent.png
    color: "#FF37474F"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/